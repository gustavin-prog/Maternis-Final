<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F78FB3">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Maternis">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <script>(function(){try{var t=localStorage.getItem('maternis-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);document.documentElement.setAttribute('data-bs-theme',t);}catch(e){}})();</script>
    <title>Maternis - Meu Bebê</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/maternis-theme.css">
    <link rel="stylesheet" href="css/maternis-ui.css">
    <link rel="stylesheet" href="css/valdenia.css">
    <!-- SDK DO SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Arial, sans-serif;
        }

        body {
            background: #fff7fb;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #d85b8b;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
            transition: .2s;
        }

        .btn-voltar:hover {
            color: #b94370;
        }

        h1 {
            text-align: center;
            color: #d85b8b;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .15);
        }

        /* Foto do Bebê */
        .preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .foto-preview {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #f2c2d6;
            background: #fdf2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 50px;
            color: #d85b8b;
        }

        .foto-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            color: #a83d69;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #f2c2d6;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            background: white;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #d85b8b;
        }

        textarea {
            resize: none;
            height: 100px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            background: #d85b8b;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
            transition: .3s;
        }

        button:hover {
            background: #b94370;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .resumo {
            margin-top: 30px;
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .15);
        }

        .resumo-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .resumo-foto {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #d85b8b;
            display: none;
        }

        .resumo h2 {
            color: #d85b8b;
        }

        .info {
            margin: 10px 0;
            color: #555;
            font-size: 17px;
        }

        .status {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }
        [data-theme="dark"] .card,
        [data-theme="dark"] .resumo { background: var(--bg-surface) !important; color: var(--text-main) !important; }
        [data-theme="dark"] .subtitulo,
        [data-theme="dark"] .info { color: var(--text-muted) !important; }
    </style>
</head>

<body>

    <div class="container">

        <a href="menu.html" class="btn-voltar">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao menu
        </a>

        <h1>👶 Meu Bebê</h1>

        <p class="subtitulo">
            Cadastre as informações do seu bebê e acompanhe seu crescimento.
        </p>

        <div class="card">

            <div class="preview-container">
                <div class="foto-preview" id="previewArea">
                    <i class="fa-solid fa-baby"></i>
                </div>
            </div>

            <label for="fotoInput">Foto do bebê</label>
            <input type="file" id="fotoInput" accept="image/*" onchange="mostrarPreviewLocal(event)">

            <label for="nome">Nome do bebê</label>
            <input type="text" id="nome" placeholder="Nome do bebê">

            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento">

            <label for="peso">Peso (kg)</label>
            <input type="number" step="0.01" id="peso" placeholder="Ex: 3.5">

            <label for="altura">Altura (cm)</label>
            <input type="number" id="altura" placeholder="Ex: 50">

            <label for="sexo">Sexo</label>
            <select id="sexo">
                <option value="Menino">Menino</option>
                <option value="Menina">Menina</option>
            </select>

            <label for="obs">Observações</label>
            <textarea id="obs" placeholder="Anotações sobre saúde, preferências ou rotina..."></textarea>

            <button id="btnSalvar" onclick="salvarDados()">
                💾 Salvar informações
            </button>

            <div class="status" id="status"></div>

        </div>

        <div class="resumo" id="blocoResumo" style="display: none;">
            <div class="resumo-header">
                <img id="rFoto" class="resumo-foto" src="" alt="Foto do Bebê">
                <h2>❤️ Resumo do Bebê</h2>
            </div>

            <p class="info" id="rNome"></p>
            <p class="info" id="rNascimento"></p>
            <p class="info" id="rIdade"></p>
            <p class="info" id="rPeso"></p>
            <p class="info" id="rAltura"></p>
            <p class="info" id="rSexo"></p>
            <p class="info" id="rObs"></p>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://llktarpnobeigwgxfwwz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_OKqhjXKeDyuon0S05JJX-g_zvIl-Kk1";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let usuarioAtual = null;
        let fotoUrlAtual = "";

        // Preview da foto antes de subir
        function mostrarPreviewLocal(event) {
            const arquivo = event.target.files[0];
            if (arquivo) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('previewArea').innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                };
                reader.readAsDataURL(arquivo);
            }
        }

        function calcularIdade(dataNascimento) {
            if (!dataNascimento) return "Não informada";
            const hoje = new Date();
            const nascimento = new Date(dataNascimento + "T00:00:00");

            let anos = hoje.getFullYear() - nascimento.getFullYear();
            let meses = hoje.getMonth() - nascimento.getMonth();
            let dias = hoje.getDate() - nascimento.getDate();

            if (dias < 0) {
                meses--;
                const ultimoMes = new Date(hoje.getFullYear(), hoje.getMonth(), 0);
                dias += ultimoMes.getDate();
            }

            if (meses < 0) {
                anos--;
                meses += 12;
            }

            if (anos > 0) return `${anos} ano${anos > 1 ? "s" : ""} e ${meses} mês${meses != 1 ? "es" : ""}`;
            if (meses > 0) return `${meses} mês${meses > 1 ? "es" : ""} e ${dias} dia${dias != 1 ? "s" : ""}`;
            return `${dias} dia${dias != 1 ? "s" : ""}`;
        }

        // Carrega dados do Supabase
        async function carregarDadosSupabase() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = "index.html";
                return;
            }
            usuarioAtual = session.user;

            const { data, error } = await supabaseClient
                .from('bebes')
                .select('*')
                .eq('user_id', usuarioAtual.id)
                .single();

            if (data) {
                document.getElementById('nome').value = data.nome || "";
                document.getElementById('nascimento').value = data.nascimento || "";
                document.getElementById('peso').value = data.peso || "";
                document.getElementById('altura').value = data.altura || "";
                document.getElementById('sexo').value = data.sexo || "Menino";
                document.getElementById('obs').value = data.obs || "";

                if (data.foto_url) {
                    fotoUrlAtual = data.foto_url;
                    document.getElementById('previewArea').innerHTML = `<img src="${fotoUrlAtual}" alt="Foto do Bebê">`;
                }

                atualizarResumo(data);
            }
        }

        // Salvar dados no Supabase e no Storage
        async function salvarDados() {
            if (!usuarioAtual) return;

            const btn = document.getElementById('btnSalvar');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.style.color = "#a83d69";
            status.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvando informações...';

            const arquivoFoto = document.getElementById('fotoInput').files[0];

            try {
                // Upload da foto caso selecionada
                if (arquivoFoto) {
                    const extensao = arquivoFoto.name.split('.').pop();
                    const caminhoArquivo = `${usuarioAtual.id}/perfil_${Date.now()}.${extensao}`;

                    const { error: uploadError } = await supabaseClient.storage
                        .from('fotos-bebes')
                        .upload(caminhoArquivo, arquivoFoto, { upsert: true });

                    if (uploadError) throw uploadError;

                    const { data: { publicUrl } } = supabaseClient.storage
                        .from('fotos-bebes')
                        .getPublicUrl(caminhoArquivo);

                    fotoUrlAtual = publicUrl;
                }

                const dadosBebe = {
                    user_id: usuarioAtual.id,
                    nome: document.getElementById('nome').value,
                    nascimento: document.getElementById('nascimento').value || null,
                    peso: document.getElementById('peso').value ? parseFloat(document.getElementById('peso').value) : null,
                    altura: document.getElementById('altura').value ? parseInt(document.getElementById('altura').value) : null,
                    sexo: document.getElementById('sexo').value,
                    obs: document.getElementById('obs').value,
                    foto_url: fotoUrlAtual,
                    updated_at: new Date().toISOString()
                };

                const { error: dbError } = await supabaseClient
                    .from('bebes')
                    .upsert(dadosBebe, { onConflict: 'user_id' });

                if (dbError) throw dbError;

                atualizarResumo(dadosBebe);
                status.style.color = "green";
                status.innerHTML = "✅ Dados salvos com sucesso no sistema!";
            } catch (err) {
                status.style.color = "red";
                status.innerHTML = "❌ Erro ao salvar: " + err.message;
            } finally {
                btn.disabled = false;
                setTimeout(() => { status.innerHTML = ""; }, 4000);
            }
        }

        function atualizarResumo(bebe) {
            document.getElementById('blocoResumo').style.display = "block";
            const idade = calcularIdade(bebe.nascimento);

            document.getElementById('rNome').innerHTML = "👶 <strong>Nome:</strong> " + (bebe.nome || "Não informado");
            document.getElementById('rNascimento').innerHTML = "📅 <strong>Nascimento:</strong> " + (bebe.nascimento || "Não informada");
            document.getElementById('rIdade').innerHTML = "🎂 <strong>Idade:</strong> " + idade;
            document.getElementById('rPeso').innerHTML = "⚖️ <strong>Peso:</strong> " + (bebe.peso ? bebe.peso + " kg" : "Não informado");
            document.getElementById('rAltura').innerHTML = "📏 <strong>Altura:</strong> " + (bebe.altura ? bebe.altura + " cm" : "Não informada");
            document.getElementById('rSexo').innerHTML = "🚻 <strong>Sexo:</strong> " + bebe.sexo;
            document.getElementById('rObs').innerHTML = "💬 <strong>Observações:</strong> " + (bebe.obs || "Nenhuma");

            const imgEl = document.getElementById('rFoto');
            if (bebe.foto_url) {
                imgEl.src = bebe.foto_url;
                imgEl.style.display = "block";
            } else {
                imgEl.style.display = "none";
            }
        }

        window.onload = carregarDadosSupabase;
    </script>
    <script src="js/theme.js" defer></script>
    <script src="js/valdenia.js" defer></script>

    <script src="js/pwa.js" defer></script>
</body>

</html>
